<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Apple Terminal Pro</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 720px;
          height: 1280px;
          overflow: hidden;
          background: #05060a;
          font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
        }
        .terminal-window {
          position: absolute;
          left: 36px;
          top: 180px;
          width: 648px;
          height: 460px;
          border-radius: 18px;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          background: #000;
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        }
        .titlebar {
          height: 52px;
          background: #1c1c1c;
          display: flex;
          align-items: center;
          padding: 0 16px;
          border-bottom: 1px solid #333;
          position: relative;
        }
        .traffic-lights { display: flex; gap: 8px; }
        .traffic-lights span {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          display: inline-block;
        }
        .close { background: #ff5f57; }
        .minimize { background: #ffbd2e; }
        .fullscreen { background: #28c840; }
        .window-title {
          position: absolute;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "SF Pro Text", "Helvetica Neue", sans-serif;
          font-size: 16px;
          color: #bbb;
        }
        .terminal-canvas {
          flex: 1;
          padding: 28px 26px;
          font-size: 34px;
          line-height: 1.45;
          color: #bbb;
        }
        .output-line { display: block; opacity: 0; white-space: pre; }
        .output-line.dim { color: #666; }
        .output-line.accent { color: #88ff67; font-weight: 700; }
        .prompt { color: #88ff67; font-weight: 700; }
      </style>
      <div id="root" data-composition-id="code-snippet-apple-terminal-pro" data-width="720" data-height="1280">
        <div class="terminal-window" id="term-win">
          <div class="titlebar">
            <div class="traffic-lights">
              <span class="close"></span>
              <span class="minimize"></span>
              <span class="fullscreen"></span>
            </div>
            <span class="window-title">agent — watch</span>
          </div>
          <div class="terminal-canvas">
            <span class="output-line dim" id="tl1">Last login: agent@internal</span>
            <span class="output-line" id="tl2"><span class="prompt">% </span>agents --internal</span>
            <span class="output-line accent" id="tl3">count: 2</span>
            <span class="output-line" id="tl4">watch system: WEAK</span>
            <span class="output-line accent" id="tl5">safety nazar: loosened</span>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#term-win", { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
        ["#tl1", "#tl2", "#tl3", "#tl4", "#tl5"].forEach(function (id, i) {
          tl.set(id, { opacity: 1 }, 0.12 + i * 0.22);
        });
        window.__timelines["code-snippet-apple-terminal-pro"] = tl;
      </script>
    </template>
  </body>
</html>
