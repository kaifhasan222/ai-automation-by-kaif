<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>AI news</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        src: local("Anton");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "SF Pro Text";
        src: local("SF Pro Text"), local("Helvetica Neue");
        font-weight: 400;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: #080b12;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b12;
      }
      .hf-catalog-mesh-gradient-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #080b12;
        z-index: 0;
      }
      .hf-catalog-mesh-gradient-bg .mesh {
        position: absolute;
        inset: -22%;
        filter: blur(44px);
        opacity: 0.9;
        background:
          radial-gradient(circle at var(--hf-x1, 20%) var(--hf-y1, 30%), #60a5fa 0 18%, transparent 34%),
          radial-gradient(circle at var(--hf-x2, 76%) var(--hf-y2, 52%), #f472b6 0 16%, transparent 34%),
          radial-gradient(circle at var(--hf-x3, 46%) var(--hf-y3, 78%), #34d399 0 18%, transparent 34%);
      }
      .kicker {
        position: absolute;
        top: 36px;
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 10;
        font-family: "SF Pro Text", "Helvetica Neue", sans-serif;
        font-size: 18px;
        letter-spacing: 0.28em;
        color: #f5f5f7;
      }
      .zoom {
        position: absolute;
        left: 28px;
        top: 88px;
        width: 664px;
        height: 760px;
        border-radius: 36px;
        overflow: hidden;
        transform-origin: 50% 28%;
        z-index: 2;
      }
      .zoom video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 16%;
      }
      .broll {
        position: absolute;
        inset: 0;
        z-index: 5;
        background:
          radial-gradient(circle at 20% 30%, rgba(96, 165, 250, 0.45), transparent 42%),
          radial-gradient(circle at 80% 60%, rgba(244, 114, 182, 0.35), transparent 40%),
          #080b12;
      }
      .hf-catalog-terminal-simulator {
        position: absolute;
        left: 36px;
        top: 150px;
        width: 648px;
        border-radius: 24px;
        overflow: hidden;
        background: #0f172a;
        color: #e4e4e7;
        box-shadow: 0 28px 80px rgba(15, 23, 42, 0.45);
        font-family: ui-monospace, Menlo, monospace;
      }
      .hf-catalog-terminal-simulator .chrome {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 18px;
        background: #111827;
        color: #94a3b8;
        font-size: 18px;
      }
      .hf-catalog-terminal-simulator .dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #ef4444;
        box-shadow: 20px 0 #f59e0b, 40px 0 #22c55e;
        margin-right: 56px;
      }
      .hf-catalog-terminal-simulator .body {
        padding: 26px 24px 32px;
        font-size: 30px;
        line-height: 1.45;
      }
      .hf-catalog-terminal-simulator .line {
        display: block;
        opacity: 0;
        transform-origin: left center;
      }
      .hf-catalog-terminal-simulator .ok { color: #86efac; }
      .hf-catalog-terminal-simulator .bad { color: #fca5a5; }
      .hero {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: #080b12;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .hero-in {
        font-family: "Anton", sans-serif;
        font-size: 120px;
        line-height: 0.92;
        letter-spacing: 0.02em;
        color: #fff;
        text-transform: uppercase;
        padding: 0 36px;
      }
      .hero-in span { display: block; color: #ffd700; }
      .cap-shade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 380px;
        z-index: 7;
        background: linear-gradient(to top, rgba(8, 11, 18, 0.96), rgba(8, 11, 18, 0));
        pointer-events: none;
      }
      .kt-word {
        font-family: "Anton", sans-serif;
        text-transform: uppercase;
        color: #fff;
        position: absolute;
        left: 0;
        width: 100%;
        text-align: center;
        top: 980px;
        letter-spacing: 0.03em;
        line-height: 0.95;
        z-index: 8;
        opacity: 0;
        visibility: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
        z-index: 6;
        background: #080b12;
      }
      .plate .line {
        position: absolute;
        left: 48px;
        right: 48px;
        font-family: "Anton", sans-serif;
        text-transform: uppercase;
        font-size: 78px;
        line-height: 0.95;
        color: #fff;
        opacity: 0;
      }
      #e1 { top: 280px; }
      #e2 { top: 390px; }
      #e3 { top: 500px; color: #ffd700; }
      .pip {
        position: absolute;
        left: 262px;
        bottom: 120px;
        width: 196px;
        height: 196px;
        border-radius: 98px;
        overflow: hidden;
        z-index: 9;
        border: 4px solid #f5f5f7;
        background: #1c1c1e;
      }
      .pip video {
        width: 196px;
        height: 196px;
        object-fit: cover;
        object-position: center 16%;
      }
      #broll-term {
        position: absolute;
        inset: 0;
        z-index: 5;
      }
    </style>
  </head>
  <body>

      <div id="broll-1" class="clip broll" data-start="1.183" data-duration="2.755" data-track-index="2">

          <div class="chrome"><span class="dot"></span><span>safety.watch</span></div>

        <video id="v6b" class="clip" src="assets/06.mp4" playsinline data-has-audio="true" data-start="19.967" data-duration="0.486" data-media-start="3.554" data-track-index="0" data-volume="1"></video>
        <video id="v6c" class="clip" src="assets/06.mp4" playsinline data-has-audio="true" data-start="20.453" data-duration="1.952" data-media-start="4.983" data-track-index="0" data-volume="1"></video>

      <audio id="w1" class="clip" src="assets/whoosh.mp3" data-start="1.183" data-duration="0.6" data-track-index="4" data-volume="0.32"></audio>

      <audio id="w6" class="clip" src="assets/whoosh.mp3" data-start="18.274" data-duration="0.6" data-track-index="4" data-volume="0.32"></audio>
      <audio id="p6" class="clip" src="assets/pop.mp3" data-start="20.55" data-duration="0.5" data-track-index="5" data-volume="0.5"></audio>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mesh", {
        "--hf-x1": "18%", "--hf-y1": "22%", "--hf-x2": "80%", "--hf-y2": "40%", "--hf-x3": "40%", "--hf-y3": "82%"
      }, {
        "--hf-x1": "36%", "--hf-y1": "48%", "--hf-x2": "58%", "--hf-y2": "66%", "--hf-x3": "62%", "--hf-y3": "58%",
        duration: 11, ease: "sine.inOut", yoyo: true, repeat: 1
      }, 0);

      ["#z1a", "#z2a", "#z3a", "#z4a", "#z5a"].forEach(function (id, i) {
        const at = [0, 3.938, 8.117, 10.794, 14.129][i];
        const dur = [1.183, 1.518, 1.271, 1.091, 1.706][i];
        tl.fromTo(id, { scale: 1 }, { scale: 1.06, duration: dur, ease: "power1.out" }, at);
      });

      ["#s1", "#s2", "#s3", "#s4"].forEach(function (id, i) {
        tl.fromTo(id, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, 1.35 + i * 0.38);
      });
      ["#h3", "#h4", "#h5"].forEach(function (id, i) {
        const at = [9.388, 11.885, 15.835][i];
        tl.fromTo(id, { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(1.6)" }, at);
      });

      const WORDS = [
        { text: "AAJ", start: 0.02, end: 0.34 },
        { text: "OPENAI", start: 0.46, end: 0.82, gold: true },
        { text: "MAANA", start: 0.94, end: 1.16 },
        { text: "SAFETY", start: 1.32, end: 2.0, gold: true },
        { text: "NAZAR BAND", start: 2.16, end: 3.85, gold: true },
        { text: "DO", start: 4.02, end: 4.42 },
        { text: "CODING", start: 4.56, end: 5.3 },
        { text: "2 AGENTS", start: 5.58, end: 6.55, gold: true },
        { text: "WEAK", start: 6.72, end: 8.0, gold: true },
        { text: "MONITOR", start: 8.16, end: 8.62 },
        { text: "HATA DIYA", start: 8.76, end: 9.3 }
      ];
      const box = document.getElementById("kt-container");
      const fit = document.createElement("canvas").getContext("2d");
      WORDS.forEach(function (w, wi) {
        const el = document.createElement("div");
        el.className = "kt-word";
        el.id = "kt-w-" + wi;
        el.textContent = w.text;
        let size = 150;
        fit.font = "400 " + size + "px Anton, sans-serif";
        while (size > 72 && fit.measureText(w.text).width > 660) {
          size -= 4;
          fit.font = "400 " + size + "px Anton, sans-serif";
        }
        el.style.fontSize = size + "px";
        if (w.gold) el.style.color = "#FFD700";
        box.appendChild(el);
        const mode = wi % 4;
        tl.set(el, { visibility: "visible" }, w.start);
        if (mode === 0) {
          tl.fromTo(el, { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "back.out(1.7)" }, w.start);
        } else if (mode === 1) {
          tl.fromTo(el, { x: -220, opacity: 0 }, { x: 0, opacity: 1, duration: 0.18, ease: "expo.out" }, w.start);
        } else if (mode === 2) {
          tl.fromTo(el, { x: 220, opacity: 0 }, { x: 0, opacity: 1, duration: 0.18, ease: "expo.out" }, w.start);
        } else {
          tl.fromTo(el, { scale: 0.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2)" }, w.start);
        }
        tl.to(el, { opacity: 0, duration: 0.08, ease: "power2.in" }, w.end);
        tl.set(el, { opacity: 0, visibility: "hidden" }, w.end + 0.08);
      });

      tl.set("#e1", { opacity: 1, y: 70 }, 18.45);
      tl.to("#e1", { y: 0, duration: 0.18, ease: "power4.out" }, 18.45);
      tl.set("#e2", { opacity: 1, y: 50 }, 19.15);
      tl.to("#e2", { y: 0, duration: 0.16, ease: "power4.out" }, 19.15);
      tl.set("#e3", { opacity: 1, y: 40 }, 20.5);
      tl.to("#e3", { y: 0, duration: 0.14, ease: "power4.out" }, 20.5);
      tl.fromTo("#pip", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 18.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
