<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>Safety short edit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        src: local("Anton"), local("Anton Regular");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: local("Montserrat ExtraBold"), local("Montserrat");
        font-weight: 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Barlow Condensed";
        src: url("compositions/assets/fonts/BarlowCondensed-ExtraBold.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Barlow Condensed";
        src: url("compositions/assets/fonts/BarlowCondensed-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b14;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b14;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 38%;
      }
      #talk {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #070b14;
      }
      .blob {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        filter: blur(8px);
      }
      .blob-red {
        background: radial-gradient(circle, rgba(221, 0, 0, 0.85), rgba(221, 0, 0, 0) 68%);
        left: -80px;
        top: 180px;
      }
      .blob-blue {
        background: radial-gradient(circle, rgba(40, 90, 180, 0.7), rgba(40, 90, 180, 0) 70%);
        right: -120px;
        bottom: 80px;
      }
      .slam {
        position: absolute;
        left: 0;
        width: 100%;
        top: 42%;
        text-align: center;
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: 132px;
        letter-spacing: 0.03em;
        line-height: 0.9;
        color: #ffffff;
        text-transform: uppercase;
        opacity: 0;
      }
      .slam.sub {
        top: 56%;
        font-size: 72px;
        color: #ffd23a;
      }
      .kicker {
        position: absolute;
        left: 48px;
        top: 250px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.18em;
        color: #ffd23a;
        opacity: 0;
      }
      .lt {
        position: absolute;
        left: 36px;
        right: 36px;
        bottom: 210px;
      }
      .lt-main,
      .lt-sub {
        display: inline-block;
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
      }
      .lt-main {
        font-weight: 800;
        font-size: 54px;
        line-height: 1;
        color: #212529;
        background: #ffffff;
        padding: 8px 16px 6px;
        box-shadow: 8px 8px 0 0 #dd0000;
      }
      .lt-sub {
        margin-top: 10px;
        font-weight: 700;
        font-size: 32px;
        line-height: 1;
        color: #ffffff;
        background: #dd0000;
        padding: 6px 14px 5px;
        box-shadow: 6px 6px 0 0 #ffffff;
      }
      .cap {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 180px;
        text-align: center;
      }
      .cap span {
        display: inline-block;
        position: relative;
        isolation: isolate;
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: 0.02em;
        line-height: 1.15;
        color: #ffffff;
        text-transform: uppercase;
        padding: 8px 12px;
        opacity: 0;
      }
      .cap .mark {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #ff1745 0%, #df1238 100%);
        border-radius: 8px;
        z-index: -1;
        opacity: 0;
      }
      .end-scrim {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 620px;
        background: linear-gradient(180deg, rgba(7, 11, 20, 0) 0%, rgba(7, 11, 20, 0.92) 42%, #070b14 100%);
      }
      .end-copy {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 150px;
        text-align: center;
      }
      .end-line {
        font-family: "Anton", sans-serif;
        font-size: 92px;
        line-height: 0.9;
        color: #ffffff;
        letter-spacing: 0.02em;
        opacity: 0;
      }
      .end-line.gold {
        color: #ffd23a;
        font-size: 78px;
      }
      .pill {
        display: inline-block;
        margin-top: 22px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 36px;
        letter-spacing: 0.12em;
        color: #ffffff;
        background: #dd0000;
        padding: 10px 22px 8px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31.04"
      data-width="720"
      data-height="1280"
    >
      <div id="cam" data-layout-allow-overflow>
        <video
          id="talk"
          class="clip"
          src="assets/talk.mp4"
          playsinline
          data-has-audio="true"
          data-start="0"
          data-duration="31.04"
          data-track-index="0"
          data-volume="1"
        ></video>
      </div>

      <div id="cap-hook" class="clip cap" data-start="0.25" data-duration="1.9" data-track-index="3">
        <span id="hook-word">SOCHO<span class="mark" id="hook-mark"></span></span>
      </div>

      <div id="card-safety" class="clip card" data-start="2.2" data-duration="1.9" data-track-index="2">
        <div class="blob blob-red" id="blob-a"></div>
        <div class="blob blob-blue" id="blob-b"></div>
        <div class="kicker" id="k-safety">AI NEWS</div>
        <div class="slam" id="w-safety">SAFETY</div>
        <div class="slam sub" id="w-off">OFF</div>
      </div>

      <div id="cap-disable" class="clip cap" data-start="4.15" data-duration="2.45" data-track-index="3">
        <span id="dis-word">AI DISABLE<span class="mark" id="dis-mark"></span></span>
      </div>

      <div id="lt-openai" class="clip lt" data-start="7.05" data-duration="6.2" data-track-index="4">
        <div class="lt-main" id="lt1">OpenAI agents</div>
        <div class="lt-sub" id="lt2">Safety band hui</div>
      </div>

      <div id="card-not" class="clip card" data-start="13.5" data-duration="2.25" data-track-index="2">
        <div class="blob blob-blue" id="blob-c"></div>
        <div class="kicker" id="k-not">CLEAR</div>
        <div class="slam" id="w-not">NOT EVERY</div>
        <div class="slam sub" id="w-ai">AI</div>
      </div>

      <div id="cap-clear" class="clip cap" data-start="15.85" data-duration="2.9" data-track-index="3">
        <span id="clear-word">EK BAAT SAAF<span class="mark" id="clear-mark"></span></span>
      </div>

      <div id="card-control" class="clip card" data-start="19" data-duration="2.3" data-track-index="2">
        <div class="blob blob-red" id="blob-d"></div>
        <div class="kicker" id="k-ctl">RULE</div>
        <div class="slam" id="w-ctl">CONTROL</div>
        <div class="slam sub" id="w-need">ZAROORI</div>
      </div>

      <div id="lt-control" class="clip lt" data-start="21.4" data-duration="3.05" data-track-index="4">
        <div class="lt-main" id="lt3">AI control</div>
        <div class="lt-sub" id="lt4">Zaruri hai</div>
      </div>

      <div id="card-end" class="clip" data-start="24.6" data-duration="6.44" data-track-index="5" style="position: absolute; inset: 0">
        <div class="end-scrim"></div>
        <div class="end-copy">
          <div class="end-line" id="e1">FUTURE</div>
          <div class="end-line gold" id="e2">YA RISK</div>
          <div class="pill" id="e3">COMMENT KARO</div>
        </div>
      </div>

      <audio id="pop-a" src="assets/pop.mp3" data-start="0.25" data-duration="0.35" data-track-index="6" data-volume="0.45"></audio>
      <audio id="whoosh-a" src="assets/whoosh.mp3" data-start="2.2" data-duration="0.45" data-track-index="6" data-volume="0.4"></audio>
      <audio id="pop-b" src="assets/pop.mp3" data-start="2.55" data-duration="0.35" data-track-index="7" data-volume="0.4"></audio>
      <audio id="whoosh-b" src="assets/whoosh.mp3" data-start="13.5" data-duration="0.45" data-track-index="6" data-volume="0.4"></audio>
      <audio id="whoosh-c" src="assets/whoosh.mp3" data-start="19" data-duration="0.45" data-track-index="7" data-volume="0.4"></audio>
      <audio id="pop-c" src="assets/pop.mp3" data-start="24.7" data-duration="0.35" data-track-index="6" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      function slam(id, at, mode) {
        const from =
          mode === 0
            ? { y: -90, opacity: 0 }
            : mode === 1
              ? { x: -180, opacity: 0 }
              : mode === 2
                ? { x: 180, opacity: 0 }
                : { scale: 0.45, opacity: 0 };
        const to =
          mode === 3
            ? { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(2.2)" }
            : { x: 0, y: 0, opacity: 1, duration: 0.22, ease: mode === 0 ? "back.out(1.7)" : "expo.out" };
        tl.fromTo("#" + id, from, to, at);
      }

      function sweep(wordId, markId, at) {
        tl.fromTo("#" + wordId, { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, at);
        tl.fromTo(
          "#" + markId,
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.32, ease: "power2.out" },
          at + 0.12,
        );
      }

      tl.fromTo("#cam", { scale: 1 }, { scale: 1.08, duration: 6.2, ease: "power1.inOut" }, 6.9);
      tl.fromTo(
        "#cam",
        { scale: 1.08 },
        { scale: 1, duration: 0.35, ease: "power2.out", immediateRender: false },
        13.35,
      );
      tl.fromTo(
        "#cam",
        { scale: 1 },
        { scale: 1.06, duration: 5.2, ease: "power1.inOut", immediateRender: false },
        21.4,
      );

      sweep("hook-word", "hook-mark", 0.3);
      slam("k-safety", 2.25, 1);
      slam("w-safety", 2.32, 0);
      slam("w-off", 3.05, 3);
      tl.fromTo("#blob-a", { x: -30 }, { x: 40, duration: 1.8, ease: "power1.inOut" }, 2.2);
      tl.fromTo("#blob-b", { x: 20 }, { x: -30, duration: 1.8, ease: "power1.inOut" }, 2.2);

      sweep("dis-word", "dis-mark", 4.25);

      tl.fromTo("#lt1", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 7.2);
      tl.fromTo("#lt2", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 7.45);

      slam("k-not", 13.58, 1);
      slam("w-not", 13.65, 2);
      slam("w-ai", 14.4, 3);
      tl.fromTo("#blob-c", { x: 30 }, { x: -20, duration: 2, ease: "power1.inOut" }, 13.5);

      sweep("clear-word", "clear-mark", 15.95);

      slam("k-ctl", 19.08, 1);
      slam("w-ctl", 19.15, 0);
      slam("w-need", 19.9, 3);
      tl.fromTo("#blob-d", { x: -20 }, { x: 36, duration: 2, ease: "power1.inOut" }, 19);

      tl.fromTo("#lt3", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 21.5);
      tl.fromTo("#lt4", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 21.75);

      tl.fromTo("#e1", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 24.75);
      tl.fromTo("#e2", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 25.15);
      tl.fromTo("#e3", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(2)" }, 25.55);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
